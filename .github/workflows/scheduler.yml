name: Curfew scheduler tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: curfew-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Esegue le azioni dovute
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python curfew_bot.py --tick

      - name: Salva lo stato aggiornato nel repository
        run: |
          git config user.name "curfew-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/state.json config/curfew-config.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Aggiorna stato scheduler [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fallito (tentativo $i), riprovo dopo un riallineamento..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((RANDOM % 5 + 1))
          done
          echo "Push definitivamente fallito dopo 5 tentativi."
          exit 1
